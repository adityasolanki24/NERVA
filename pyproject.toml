[project]
name = "nerva"
version = "0.0.1"
description = "NERVA: expressive, affect-conditioned locomotion research built on Open Duck Mini v2"
readme = "README.md"
requires-python = ">=3.10"
# Core dependencies are deliberately minimal: interfaces, appraisal, affect and
# gait metrics need only NumPy. MuJoCo/Open Duck are needed only by
# nerva/open_duck_sim.py and are installed separately (see README).
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest>=8"]
experiments = ["matplotlib>=3.8", "imageio>=2.30", "imageio-ffmpeg>=0.5"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nerva"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["experiments/cloud_runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "B905", "E741", "B007"]
